<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FLASH ARCHIVE</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    .flashLabel {
  position: fixed;
  z-index: 90;
  color: rgba(255,255,255,0.78);
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(6px);
  padding: 8px 10px;
  font-size: 11px;
  letter-spacing: 1.5px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

    #viewer {
      width: 100vw;
      height: 100vh;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #viewer.visible {
      opacity: 1;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 35%), #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .intro-inner {
      max-width: 420px;
      padding: 24px;
    }

    .intro-title {
      font-size: 18px;
      letter-spacing: 4px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    .intro-text {
      color: rgba(255,255,255,0.58);
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    button {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 12px 22px;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(255,255,255,0.85);
    }

    .top-title {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 40;
      color: rgba(255,255,255,0.65);
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .top-title.visible {
      opacity: 1;
    }

    #hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      color: rgba(255,255,255,0.45);
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    #hint.visible {
      opacity: 1;
    }

    .contactBtn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 14px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 1s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .contactBtn.visible {
      opacity: 1;
    }

    .contactBtn:hover {
      color: white;
      border-color: rgba(255,255,255,0.75);
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        repeating-radial-gradient(circle at 50% 50%,
        rgba(255,255,255,0.25) 0,
        rgba(255,255,255,0.25) 1px,
        transparent 1px,
        transparent 3px);
      mix-blend-mode: overlay;
    }

.lens {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 25;
  box-shadow:
    inset 0 0 80px rgba(0,0,0,0.35),
    inset 0 0 180px rgba(0,0,0,0.22);
  background:
    radial-gradient(circle at center,
      transparent 55%,
      rgba(0,0,0,0.04) 75%,
      rgba(0,0,0,0.22) 100%);
}
  </style>
</head>

<body>

  <div id="intro">
    <div class="intro-inner">
      <div class="intro-title">FLASH ARCHIVE</div>
      <div class="intro-text">
        available flash designs<br>
        drag / zoom / explore
      </div>
      <button onclick="enterArchive()">ENTER ARCHIVE</button>
      <script>
  const label = document.getElementById("flashLabel");

  const labels = [
    {
      title: "RITUAL_01",
      status: "available",
      x: 0.5,
      y: 0.5,
      radius: 0.5
    }
  ];

  viewer.addHandler("canvas-move", function(event) {
    const viewportPoint = viewer.viewport.pointFromPixel(event.position);
    let found = null;

    labels.forEach(item => {
      const dx = viewportPoint.x - item.x;
      const dy = viewportPoint.y - item.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < item.radius) {
        found = item;
      }
    });

    if (found) {
      label.innerHTML = `${found.title}<br>${found.status}`;
      label.style.left = event.position.x + 18 + "px";
      label.style.top = event.position.y + 18 + "px";
      label.style.opacity = 1;
    } else {
      label.style.opacity = 0;
    }
  });
</script>
    </div>
  </div>

  <div class="top-title" id="topTitle">FLASH ARCHIVE</div>
  <div id="viewer"></div>
  <div id="hint">drag / pinch / zoom</div>

  <a id="contactBtn" class="contactBtn" href="https://www.instagram.com/zenitis.tattoo/" target="_blank">
    contact / booking
  </a>

  <div class="noise"></div>
  <div id="flashLabel" class="flashLabel"></div>
  <div class="lens"></div>

  <script>
    const viewer = OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
      tileSources: "canvas.dzi",

      showNavigator: false,
      showZoomControl: false,
      showHomeControl: false,
      showFullPageControl: false,

      animationTime: 1.0,
      blendTime: 0.1,

      visibilityRatio: 1,
      constrainDuringPan: true,

      minZoomImageRatio: 0.85,
      maxZoomPixelRatio: 3,

      gestureSettingsTouch: {
        pinchToZoom: true,
        flickEnabled: true
      }
    });

    function enterArchive() {
      document.getElementById("intro").classList.add("hidden");
      document.getElementById("viewer").classList.add("visible");
      document.getElementById("topTitle").classList.add("visible");
      document.getElementById("hint").classList.add("visible");
      document.getElementById("contactBtn").classList.add("visible");

      setTimeout(() => {
        document.getElementById("hint").classList.remove("visible");
      }, 4000);
    }
  </script>

</body>
</html>
