<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flash Archive</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }

    .title {
      position: fixed;
      top: 16px;
      left: 20px;

      color: rgba(255,255,255,0.7);

      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;

      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="title">
FLASH ARCHIVE
</div>

<div id="viewer"></div>

<script>

OpenSeadragon({

    id: "viewer",

    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",

    tileSources: "canvas.dzi",

    showNavigator: false,

    showZoomControl: false,
    showHomeControl: false,
    showFullPageControl: false,

    animationTime: 1.2,
    blendTime: 0.1,

    minZoomImageRatio: 0.8,

    maxZoomPixelRatio: 3,

    visibilityRatio: 1,

    constrainDuringPan: true,

    gestureSettingsTouch: {
      pinchToZoom: true
    }

});

</script>

</body>
</html>
